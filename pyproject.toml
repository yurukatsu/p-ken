[project]
name = "p-ken"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "yurukatsu", email = "yuruyuru.kaihatsu@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
    "pandas>=3.1.0",
    "scipy>=1.18.1",
]

[project.scripts]
p-ken = "p_ken:main"

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ruff>=0.17.2",
]
