[project]
name = "p-ken"
version = "0.1.0"
description = "EM market review figures and factor returns (MSCI EM / RGA)"
readme = "README.md"
authors = [
    { name = "yurukatsu", email = "yuruyuru.kaihatsu@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
    "pandas>=3.1.0",
    "scipy>=1.18.1",
    "squarify>=0.4.5",
]

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
    "nbconvert>=7.17.2",
    "pytest>=8",
    "ruff>=0.17.2",
]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
